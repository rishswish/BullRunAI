# CI/CD for the agent service: test -> build -> push -> deploy (MCP server + agent API).
# Trigger from the repo root on pushes to main touching agent_service/**.
#
# Secrets live in Secret Manager (create once, see DEPLOY.md):
#   google-api-key, polygon-api-key, firebase-service-account, langsmith-api-key
substitutions:
  _REGION: us-central1
  _REPO: br
  _AGENT_SERVICE: br-agent
  _MCP_SERVICE: br-mcp
  _RUNTIME_SA: br-agent-runtime  # service account name (without @...)
  _CLIENT_ORIGIN: https://your-frontend-url
  _GOOGLE_CLIENT_ID: your-oauth-client-id.apps.googleusercontent.com
  _INDEX_GCS_URI: gs://your-bucket/filings_index

steps:
  - id: unit-tests
    name: python:3.12-slim
    dir: agent_service
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && python -m pytest -q"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent:$SHORT_SHA",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent:latest", "agent_service"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent"]

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_MCP_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent:$SHORT_SHA
      - --region=${_REGION}
      - --command=python
      - --args=-m,bullrun_agent.mcp_server,--http
      - --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=EMBEDDING_PROVIDER=gemini,INDEX_GCS_URI=${_INDEX_GCS_URI}
      - --set-secrets=GOOGLE_API_KEY=google-api-key:latest,POLYGON_API_KEY=polygon-api-key:latest
      - --memory=1Gi
      - --allow-unauthenticated   # public market-data tools only; see DEPLOY.md to lock down

  - id: deploy-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        MCP_URL=$(gcloud run services describe ${_MCP_SERVICE} --region=${_REGION} --format='value(status.url)')
        gcloud run deploy ${_AGENT_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent:$SHORT_SHA \
          --region=${_REGION} \
          --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars="^@^LLM_PROVIDER=gemini@LLM_MODEL=gemini-2.5-flash@ROUTER_MODEL=gemini-2.5-flash-lite@TOOLS_MODE=mcp@MCP_SERVER_URL=$${MCP_URL}/mcp@PROJECT_ID=$PROJECT_ID@GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}@CORS_ORIGINS=${_CLIENT_ORIGIN}@LANGSMITH_TRACING=true@LANGSMITH_PROJECT=bullrun-agent@INDEX_GCS_URI=${_INDEX_GCS_URI}" \
          --set-secrets=GOOGLE_API_KEY=google-api-key:latest,POLYGON_API_KEY=polygon-api-key:latest,FIREBASE_SERVICE_ACCOUNT=firebase-service-account:latest,LANGSMITH_API_KEY=langsmith-api-key:latest \
          --memory=1Gi --cpu=1 --timeout=300 --concurrency=40 --min-instances=0 --max-instances=5 \
          --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/br-agent:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
