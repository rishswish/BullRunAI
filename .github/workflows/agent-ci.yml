name: agent-ci

on:
  pull_request:
    paths: ["agent_service/**", ".github/workflows/agent-ci.yml"]
  push:
    branches: [main]
    paths: ["agent_service/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: agent_service

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check bullrun_agent evals tests
      - run: python -m pytest -q
      - name: eval harness plumbing (offline)
        run: python -m evals.run_evals --no-judge
        env: { LLM_PROVIDER: fake, EMBEDDING_PROVIDER: hash }

  llm-evals:
    # Real-model quality gate. Runs only when the API key secret is configured.
    needs: unit-tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.5-flash
      ROUTER_MODEL: gemini-2.5-flash-lite
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: bullrun-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: run evals (fails the build if a gate is missed)
        if: ${{ env.GOOGLE_API_KEY != '' }}
        run: python -m evals.run_evals --suite agent
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: agent_service/evals/results/ }
